<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Portal UTP Ica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --red: #E30613; --red-dark: #A8000E;
      --black: #111111; --gray: #F4F4F6;
      --border: #E2E2E8; --text: #111; --muted: #888;
      --font: 'Plus Jakarta Sans', sans-serif;
    }
    body {
      font-family: var(--font);
      background: var(--black);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }
    .bg-pattern {
      position: absolute; inset: 0;
      background: radial-gradient(circle at 20% 80%, rgba(227,6,19,0.15) 0%, transparent 50%),
                  radial-gradient(circle at 80% 20%, rgba(227,6,19,0.08) 0%, transparent 50%);
    }
    .login-card {
      position: relative; z-index: 1;
      background: #fff; border-radius: 20px;
      padding: 48px 44px; width: 100%; max-width: 420px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.4);
    }
    .login-logo {
      display: flex; align-items: center; gap: 12px; margin-bottom: 32px;
    }
    .logo-box {
      width: 50px; height: 50px; background: var(--black);
      border-left: 4px solid var(--red); border-radius: 8px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1px;
    }
    .logo-box span:first-child { font-weight: 800; font-size: 0.95rem; color: #fff; letter-spacing: 0.05em; }
    .logo-box span:last-child  { font-size: 0.48rem; color: var(--red); font-weight: 700; letter-spacing: 0.1em; }
    .logo-text h1 { font-size: 1rem; font-weight: 800; color: var(--black); }
    .logo-text p  { font-size: 0.72rem; color: var(--muted); margin-top: 1px; }

    .login-title { font-size: 1.5rem; font-weight: 800; color: var(--black); margin-bottom: 6px; }
    .login-sub   { font-size: 0.88rem; color: var(--muted); margin-bottom: 32px; }

    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
    .field label { font-size: 0.82rem; font-weight: 700; color: #444; }
    .field input {
      padding: 12px 16px; border: 1.5px solid var(--border);
      border-radius: 8px; font-family: var(--font); font-size: 0.95rem;
      outline: none; transition: border-color 0.18s, box-shadow 0.18s;
      background: var(--gray);
    }
    .field input:focus {
      border-color: var(--red); background: #fff;
      box-shadow: 0 0 0 3px rgba(227,6,19,0.1);
    }
    .field input.error { border-color: #e53e3e; }

    .btn-login {
      width: 100%; padding: 14px; background: var(--red); color: #fff;
      border: none; border-radius: 10px; font-family: var(--font);
      font-weight: 700; font-size: 1rem; cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      margin-top: 8px;
    }
    .btn-login:hover { background: var(--red-dark); transform: translateY(-1px); }
    .btn-login:active { transform: translateY(0); }

    .error-msg {
      background: #fff5f5; border: 1px solid #feb2b2;
      color: #c53030; padding: 12px 16px; border-radius: 8px;
      font-size: 0.85rem; margin-bottom: 18px; display: none;
    }
    .error-msg.show { display: block; }

    .login-footer {
      text-align: center; margin-top: 24px;
      font-size: 0.78rem; color: var(--muted);
    }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.82rem; color: var(--muted); text-decoration: none;
      margin-bottom: 24px; transition: color 0.18s;
    }
    .back-link:hover { color: var(--red); }

    .hint {
      background: #f0f0f4; border-radius: 8px;
      padding: 10px 14px; font-size: 0.78rem; color: var(--muted);
      margin-top: 16px; line-height: 1.5;
    }
    .hint strong { color: var(--black); }
  </style>
</head>
<body>
  <div class="bg-pattern"></div>
  <div class="login-card">
    <a href="../index.html" class="back-link">← Volver al portal</a>
    <div class="login-logo">
      <div class="logo-box"><span>UTP</span><span>ICA</span></div>
      <div class="logo-text">
        <h1>Panel de Administración</h1>
        <p>Portal de Eventos 2026</p>
      </div>
    </div>
    <h2 class="login-title">Iniciar sesión</h2>
    <p class="login-sub">Accede con tus credenciales de administrador</p>

    <div class="error-msg" id="error-msg">❌ Usuario o contraseña incorrectos.</div>

    <div class="field">
      <label for="user">Usuario</label>
      <input type="text" id="user" placeholder="admin" autocomplete="username">
    </div>
    <div class="field">
      <label for="pass">Contraseña</label>
      <input type="password" id="pass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn-login" id="btn-login">Ingresar al panel →</button>

    <div class="hint">
      🔑 Credenciales de demo:<br>
      <strong>Usuario:</strong> admin &nbsp;|&nbsp; <strong>Contraseña:</strong> utp2026
    </div>

    <div class="login-footer">
      &copy; 2026 UTP Sede Ica — Panel Administrativo
    </div>
  </div>

  <script>
    let storedConfig = {};
    try {
      storedConfig = JSON.parse(localStorage.getItem('utp_config') || '{}');
    } catch(e) {
      storedConfig = {};
    }
    const CREDENTIALS = { user: 'admin', pass: storedConfig.pass || 'utp2026' };

    document.getElementById('btn-login').addEventListener('click', login);
    document.getElementById('pass').addEventListener('keydown', e => e.key === 'Enter' && login());

    function login() {
      const u = document.getElementById('user').value.trim();
      const p = document.getElementById('pass').value;
      const errMsg = document.getElementById('error-msg');

      if (u === CREDENTIALS.user && p === CREDENTIALS.pass) {
        try { sessionStorage.setItem('utp_admin', 'true'); } catch(e) {}
        window.location.href = 'dashboard.html';
      } else {
        errMsg.classList.add('show');
        document.getElementById('user').classList.add('error');
        document.getElementById('pass').classList.add('error');
        setTimeout(() => {
          errMsg.classList.remove('show');
          document.getElementById('user').classList.remove('error');
          document.getElementById('pass').classList.remove('error');
        }, 3000);
      }
    }
  </script>
</body>
</html>
